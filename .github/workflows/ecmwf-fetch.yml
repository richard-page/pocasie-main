name: ECMWF Real Data Fetch

on:
  schedule:
    - cron: '0 */6 * * *'  # Každých 6 hodín
  workflow_dispatch:  # Manual trigger

jobs:
  fetch-ecmwf:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Python dependencies
      run: |
        pip install requests xarray cfgrib pandas numpy eccodes ecmwf-opendata scipy
        
    - name: Fetch real ECMWF data from data.ecmwf.int
      run: |
        cd backend
        python fetch_ecmwf_baltic.py
        python fetch_ecmwf_real.py
        python fetch_ecmwf_eu_grid.py --tile all
        python fetch_ecmwf_point.py --lat 56.85 --lon 26.22 --name Madona --output ecmwf_point_56.85_26.22.json
        python fetch_ecmwf_point.py --lat 54.71 --lon 20.51 --name Kaliningrad --output ecmwf_point_54.71_20.51.json
        python fetch_ecmwf_point.py --lat 50.12 --lon 8.68 --name Frankfurt --output ecmwf_point_50.12_8.68.json
        python fetch_ecmwf_point.py --lat 48.43 --lon 17.80 --name Hlohovec --output ecmwf_point_48.43_17.80.json
        
    - name: Commit and push if changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add backend/ecmwf_forecast_*.json backend/ecmwf_point_*.json
        git diff --staged --quiet || git commit -m "Update ECMWF forecast [$(date)]"
        git pull origin main --rebase || true
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
