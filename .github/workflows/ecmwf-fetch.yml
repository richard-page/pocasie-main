name: ECMWF Real Data Fetch

on:
  schedule:
    - cron: '0 */6 * * *'  # Každých 6 hodín
  workflow_dispatch:  # Manual trigger

jobs:
  fetch-ecmwf:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install Python dependencies
      run: |
        pip install requests xarray cfgrib pandas numpy eccodes ecmwf-opendata
        
    - name: Fetch real ECMWF data from data.ecmwf.int
      run: |
        cd backend
        python fetch_ecmwf_real.py
        
    - name: Commit and push if changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add backend/ecmwf_forecast_*.json
        git diff --staged --quiet || git commit -m "Update ECMWF forecast [$(date)]"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
