name: CDS ECMWF Fetch

on:
  schedule:
    - cron: '0 */6 * * *'  # Každých 6 hodín
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install CDS API
      run: |
        pip install --upgrade pip
        pip install cads-api-client
        
    - name: Fetch ECMWF data
      env:
        CDS_API_KEY: e1f7a29a-8a37-494c-86ff-8795fea9b426
      run: |
        cd backend
        python fetch_cds.py
        
    - name: Commit and push
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add backend/ecmwf_forecast.json
        git diff --staged --quiet || git commit -m "CDS ECMWF update $(date)"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
